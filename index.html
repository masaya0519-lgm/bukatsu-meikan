<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>野球部 選手名鑑 2024</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      font-family:'Noto Sans JP','Hiragino Kaku Gothic Pro',sans-serif;
      background:#0a1428;
      background-image:
        radial-gradient(ellipse at 15% 60%,rgba(30,80,180,.45) 0%,transparent 55%),
        radial-gradient(ellipse at 85% 20%,rgba(80,30,160,.3) 0%,transparent 50%),
        repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(0,0,40,.45) 3px,rgba(0,0,40,.45) 4px);
      min-height:100vh;
      overflow:hidden;
    }

    /* ─── ゲームタイトルバー ─── */
    .gtitle{
      height:36px;
      background:linear-gradient(90deg,#06102a 0%,#0d1a44 50%,#06102a 100%);
      border-bottom:2px solid #b89000;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 14px;
    }
    .gtitle-logo{font-size:14px;font-weight:900;color:#f0c800;letter-spacing:4px;text-shadow:0 0 10px rgba(240,200,0,.5);}
    .gtitle-ver{font-size:10px;color:#4a5a7a;letter-spacing:2px;}

    /* ─── ページ全体レイアウト ─── */
    .page{
      display:flex;
      height:calc(100vh - 36px);
    }

    /* ─── 左サイドバー（選手ピル） ─── */
    .sidebar{
      width:94px;flex-shrink:0;
      background:rgba(2,4,18,.7);
      border-right:1px solid #1a2040;
      display:flex;flex-direction:column;
      padding:6px 5px 6px;
      gap:3px;
      overflow-y:auto;
    }
    /* すべて + 矢印ナビ */
    .sb-nav{
      display:flex;align-items:center;gap:3px;
      margin-bottom:4px;flex-shrink:0;
    }
    .sb-arrow{
      width:18px;height:22px;
      background:linear-gradient(180deg,#1a2a55,#0d1a3a);
      border:1px solid #2a3a66;border-radius:2px;
      display:flex;align-items:center;justify-content:center;
      font-size:9px;color:#aac;cursor:pointer;flex-shrink:0;
    }
    .sb-all{
      flex:1;height:22px;
      background:linear-gradient(180deg,#5588cc,#3366aa);
      border:1px solid #6699dd;border-radius:3px;
      display:flex;align-items:center;justify-content:center;
      font-size:11px;font-weight:900;color:#fff;cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
    }
    /* 名前ピル（姓のみ） */
    .npill{
      height:30px;
      background:linear-gradient(180deg,#f09090,#d06868);
      border:1px solid #cc5555;border-radius:4px;
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:900;color:#fff;
      cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 2px rgba(0,0,0,.3);
      transition:filter .1s;
      flex-shrink:0;
    }
    .npill:hover{filter:brightness(1.12);}
    .npill.active{
      background:linear-gradient(180deg,#ffe566,#ddcc33);
      border-color:#ccaa00;color:#222;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 8px rgba(240,200,0,.4);
    }
    .npill.pitcher{
      background:linear-gradient(180deg,#88cc77,#55aa44);
      border-color:#44aa33;
    }

    /* ─── メインエリア ─── */
    .main{
      flex:1;display:flex;flex-direction:column;
      overflow:hidden;
      min-width:0;
    }

    /* ─── タブバー ─── */
    .tabbar{
      height:32px;
      background:linear-gradient(180deg,#0a1a3a 0%,#060f26 100%);
      border-bottom:2px solid #1a2a5a;
      display:flex;align-items:flex-end;
      padding:0 8px;gap:2px;
      flex-shrink:0;
    }
    .tbbtn{
      font-size:10px;color:#4a5a7a;
      background:#081228;border:1px solid #1a2044;border-bottom:none;
      padding:3px 8px 5px;border-radius:3px 3px 0 0;
      cursor:pointer;white-space:nowrap;font-family:inherit;
    }
    .tbbtn.active{
      color:#fff;font-weight:700;
      background:linear-gradient(180deg,#1a4488,#0d2a66);
      border-color:#3366cc;
      box-shadow:0 0 8px rgba(50,100,220,.35);
    }
    .tb-lr{
      font-size:9px;color:#2a3a55;
      background:#080f22;border:1px solid #1a2044;
      padding:2px 5px;border-radius:2px;margin-bottom:3px;
    }
    .tb-sp{flex:1;}

    /* ─── プレイヤーカード描画領域 ─── */
    .cardwrap{
      flex:1;overflow-y:auto;
    }

    /* ─── カードアニメ ─── */
    .pcard{animation:ci .2s ease;}
    @keyframes ci{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

    /* ─── カードヘッダー（暗い） ─── */
    .ch{
      background:linear-gradient(180deg,#1a3a6a 0%,#102850 100%);
      border-bottom:2px solid #0a1a3a;
      padding:8px 12px 7px;
    }
    /* 1行目: バッジ+名前+番号+★+ちびキャラ */
    .ch-r1{display:flex;align-items:center;gap:9px;}
    .tbadge{
      width:40px;height:40px;border-radius:50%;flex-shrink:0;
      background:linear-gradient(135deg,#dd3311,#991100);
      display:flex;align-items:center;justify-content:center;
      font-size:22px;
      box-shadow:0 0 10px rgba(200,40,10,.5),inset 0 1px 0 rgba(255,255,255,.2);
    }
    .pname{font-size:clamp(16px,3vw,22px);font-weight:900;color:#fff;letter-spacing:2px;}
    .numbadge{
      display:flex;align-items:center;gap:1px;
      background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);
      border-radius:3px;padding:1px 7px;
      font-size:18px;font-weight:900;color:#fff;flex-shrink:0;
    }
    .numbadge .eq{font-size:13px;color:#8899bb;margin-right:2px;}
    .starbox{
      display:flex;align-items:center;gap:2px;margin-left:auto;
    }
    .star-ico{color:#f0c800;font-size:14px;}
    .star-n{font-size:22px;font-weight:900;color:#f0c800;text-shadow:0 0 8px rgba(240,200,0,.5);}
    .chibi{
      width:50px;height:50px;border-radius:4px;flex-shrink:0;
      background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);
      display:flex;align-items:center;justify-content:center;
      font-size:28px;overflow:hidden;
    }
    .chibi img{width:100%;height:100%;object-fit:cover;object-position:top;display:none;}
    .chibi img.loaded{display:block;}

    /* 2行目: 成績 */
    .ch-r2{
      display:flex;align-items:center;gap:5px;
      margin-top:6px;padding:3px 8px;
      background:rgba(0,0,0,.28);border-radius:3px;
    }
    .res-lbl{font-size:9px;color:#4a6a8a;letter-spacing:1px;margin-right:2px;}
    .res-v{font-size:11px;font-weight:700;color:#cce;}
    .res-sep{font-size:10px;color:#2a3a55;}

    /* 3行目: フォーム/投打/守備位置 */
    .ch-r3{
      display:flex;gap:14px;margin-top:5px;
      font-size:10px;
    }
    .mk{color:#4a6a8a;}
    .mv{color:#cce;font-weight:700;margin-left:4px;}

    /* ─── カードボディ（明るいクリーム色） ─── */
    .cbody{
      display:grid;grid-template-columns:165px 1fr;
      background:#e8e4d8;
    }
    @media(max-width:520px){.cbody{grid-template-columns:1fr;}}

    /* ── 能力値カラム（左） ── */
    .scol{
      padding:10px 10px;
      border-right:1px solid #c8c2b0;
    }
    .srow{
      display:flex;align-items:center;gap:5px;
      margin-bottom:4px;padding:1px 0;
    }
    .sn{font-size:11px;font-weight:700;color:#2a3040;width:48px;flex-shrink:0;}

    /* グレードボックス */
    .gb{
      width:22px;height:18px;border-radius:2px;
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:900;color:#fff;flex-shrink:0;
      border-top:1px solid rgba(255,255,255,.3);
      border-bottom:1px solid rgba(0,0,0,.35);
      text-shadow:0 1px 1px rgba(0,0,0,.5);
    }
    .g-S{background:linear-gradient(180deg,#ff1a1a,#bb0000);}
    .g-A{background:linear-gradient(180deg,#ff6600,#cc3300);}
    .g-B{background:linear-gradient(180deg,#ddaa00,#996600);}
    .g-C{background:linear-gradient(180deg,#22cc22,#118811);}
    .g-D{background:linear-gradient(180deg,#1166ee,#0044cc);}
    .g-E{background:linear-gradient(180deg,#7788aa,#445566);}
    .g-F{background:linear-gradient(180deg,#cc3322,#991111);}
    .g-G{background:linear-gradient(180deg,#666,#444);}

    /* 弾道矢印 */
    .trj{font-size:18px;color:#ee6600;flex-shrink:0;}
    .sv{font-size:14px;font-weight:900;color:#1a2030;}

    /* ── 特殊能力カラム（右） ── */
    .acol{
      padding:8px;
      display:flex;flex-wrap:wrap;
      gap:4px;align-content:flex-start;
    }

    /* 特殊能力チップ共通 */
    .chip{
      display:inline-flex;align-items:center;gap:3px;
      padding:2px 6px;border-radius:3px;
      font-size:11px;font-weight:700;
      border:1px solid;cursor:default;
      position:relative;
    }
    .chip:hover{filter:brightness(.92);}

    /* グレード付きポジティブ（緑） */
    .cg{background:#d4f0d4;border-color:#88bb88;color:#1a3a1a;}
    /* グレード付きネガティブ（赤） */
    .cr{background:#f8d8d8;border-color:#cc8888;color:#3a1a1a;}
    /* ブール○（ベージュ） */
    .cb{background:#f0ece0;border-color:#c0b888;color:#3a3020;}
    /* マイナス能力（ピンク） */
    .cm{background:#ffd4d4;border-color:#ff9999;color:#660000;}

    /* 能力内グレードボックス */
    .ag{
      width:17px;height:15px;border-radius:2px;
      display:flex;align-items:center;justify-content:center;
      font-size:10px;font-weight:900;color:#fff;flex-shrink:0;
      border-top:1px solid rgba(255,255,255,.25);
      border-bottom:1px solid rgba(0,0,0,.3);
      text-shadow:0 1px 1px rgba(0,0,0,.4);
    }

    /* ツールチップ */
    .tip{
      display:none;position:absolute;
      bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
      background:#111;border:1px solid #444;color:#ddd;
      font-size:10px;font-weight:400;padding:5px 8px;border-radius:3px;
      width:160px;white-space:normal;line-height:1.5;
      z-index:300;pointer-events:none;
    }
    .chip:hover .tip{display:block;}

    /* ─── キャッチコピー ─── */
    .cphr{
      background:linear-gradient(90deg,#06081e,#0c1430,#06081e);
      border-top:1px solid #1a2040;
      padding:8px;text-align:center;
      font-size:clamp(11px,2vw,14px);font-weight:900;
      color:#f0c800;letter-spacing:2px;
      text-shadow:0 0 8px rgba(240,200,0,.4);
    }

    /* ── スクロールバー ── */
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:#06061a;}
    ::-webkit-scrollbar-thumb{background:#1a2a66;border-radius:3px;}
  </style>
</head>

    <div class="cardwrap" id="cw"></div>
  </div>
</div>

    starRating:298,

/* ── サイドバー描画 ── */
function renderSidebar(){
  const sb=document.getElementById('sb');
  PLAYERS.forEach(p=>{
    const el=document.createElement('div');
    el.className='npill'+(p.pitcher?' pitcher':'');
    el.id='pill-'+p.id;
    el.textContent=p.surname;
    el.addEventListener('click',()=>selectPlayer(p.id));
    sb.appendChild(el);
  });
}

/* ── カード描画 ── */
function selectPlayer(id){
  document.querySelectorAll('.npill').forEach(el=>el.classList.remove('active'));
  const pill=document.getElementById('pill-'+id);
  if(pill)pill.classList.add('active');

  const p=PLAYERS.find(x=>x.id===id);
  if(!p)return;

  /* 能力値HTML */
  const statsHtml=p.stats.map(s=>{
    const g=toG(s.v);
    return`<div class="srow">
      <span class="sn">${s.n}</span>
      <div class="gb g-${g}">${g}</div>
      <span class="sv">${s.v}</span>
    </div>`;
  }).join('');

  /* 特殊能力HTML */
  const abHtml=p.abilities.map(a=>{
    if(a.type==='graded'){
      const neg=(a.g==='F'||a.g==='G');
      return`<div class="chip ${neg?'cr':'cg'}">
        ${a.n}<div class="ag g-${a.g}">${a.g}</div>
        <div class="tip">${a.d}</div>
      </div>`;
    }else if(a.type==='bool'){
      return`<div class="chip cb">${a.n}<div class="tip">${a.d}</div></div>`;
    }else{
      return`<div class="chip cm">${a.n}<div class="tip">${a.d}</div></div>`;
    }
  }).join('');

  /* 成績HTML */
  const resHtml=p.results.avg==='---'
    ?`<span class="res-v">投手</span>`
    :`<span class="res-lbl">成績</span>
      <span class="res-v">率${p.results.avg}</span>
      <span class="res-sep">|</span>
      <span class="res-v">${p.results.hr}本</span>
      <span class="res-sep">|</span>
      <span class="res-v">${p.results.rbi}打点</span>
      <span class="res-sep">|</span>
      <span class="res-v">${p.results.sb}盗</span>`;

  document.getElementById('cw').innerHTML=`
  <div class="pcard">
    <div class="ch">
      <div class="ch-r1">
        <div class="tbadge">⚾</div>
        <div class="pname">${p.name}</div>
        <div class="numbadge"><span class="eq">≡</span>${p.num}</div>
        <div class="starbox">
          <span class="star-ico">★</span>
          <span class="star-n">${p.starRating}</span>
        </div>
        <div class="chibi">
          <img src="${p.photo}" alt="${p.name}"
            onload="this.classList.add('loaded')">
          <span>${p.chibi}</span>
        </div>
      </div>
      <div class="ch-r2">${resHtml}</div>
      <div class="ch-r3">
        <div><span class="mk">フォーム</span><span class="mv">${p.form}</span></div>
        <div><span class="mk">投打</span><span class="mv">${p.thr}投${p.bat}打</span></div>
        <div><span class="mk">守備位置</span><span class="mv">${p.defPos}</span></div>
      </div>
    </div>
    <div class="cbody">
      <div class="scol">
        <div class="srow">
          <span class="sn">弾道</span>
          <span class="trj">${TRJ[Math.min(p.trajectory,5)]||'→'}</span>
          <span class="sv">${p.trajectory}</span>
        </div>
        ${statsHtml}
      </div>
      <div class="acol">${abHtml}</div>
    </div>
    <div class="cphr">${p.catchphrase}</div>
  </div>`;
}

/* 初期化 */
renderSidebar();
selectPlayer(PLAYERS[0].id);
</script>
