<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>野球部 選手名鑑 2024</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      font-family:'Noto Sans JP','Hiragino Kaku Gothic Pro',sans-serif;
      background:#04040e;
      color:#fff;
      min-height:100vh;
      overflow-x:hidden;
      background-image:repeating-linear-gradient(
        0deg,transparent 0,transparent 3px,
        rgba(0,0,30,.5) 3px,rgba(0,0,30,.5) 4px
      );
    }

    /* ─── チームヘッダー ─── */
    .team-header{
      background:linear-gradient(90deg,#08122e 0%,#0d1c55 50%,#08122e 100%);
      border-bottom:2px solid #c8a000;
      padding:8px 16px;
      display:flex;align-items:center;gap:12px;
    }
    .team-emblem{
      font-size:28px;
      width:48px;height:48px;
      background:linear-gradient(135deg,#dd3311,#aa2200);
      border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 0 12px rgba(220,50,10,.5),inset 0 1px 0 rgba(255,255,255,.2);
      flex-shrink:0;
    }
    .team-name{font-size:22px;font-weight:900;color:#f0c800;letter-spacing:4px;text-shadow:0 0 10px rgba(240,200,0,.5);}
    .team-sub{font-size:10px;color:#556;letter-spacing:3px;margin-top:2px;}
    .team-count{
      margin-left:auto;
      background:#08082a;border:1px solid #2244aa;border-radius:3px;
      padding:4px 10px;text-align:center;
    }
    .team-count .n{font-size:22px;font-weight:900;color:#fff;}
    .team-count .l{font-size:9px;color:#446;letter-spacing:2px;}

    /* ─── レイアウト ─── */
    .layout{
      display:grid;
      grid-template-columns:240px 1fr;
      height:calc(100vh - 68px);
    }
    @media(max-width:640px){
      .layout{grid-template-columns:1fr;height:auto;}
    }

    /* ─── ロースターパネル（左） ─── */
    .roster-panel{
      border-right:1px solid #111130;
      background:linear-gradient(180deg,#060618 0%,#040412 100%);
      overflow-y:auto;
      display:flex;flex-direction:column;
    }
    .roster-title{
      padding:8px 12px;
      font-size:10px;font-weight:900;letter-spacing:3px;color:#3355aa;
      background:#050514;
      border-bottom:1px solid #111130;
      flex-shrink:0;
    }
    /* プレイヤー行 */
    .p-row{
      display:flex;align-items:center;gap:8px;
      padding:9px 10px;
      border-bottom:1px solid rgba(255,255,255,.04);
      cursor:pointer;
      transition:background .1s;
      position:relative;
    }
    .p-row:hover{background:rgba(51,102,204,.12);}
    .p-row.active{
      background:linear-gradient(90deg,rgba(30,80,200,.35),rgba(10,30,80,.2));
      border-left:3px solid #4488ff;
    }
    .p-row.active::after{
      content:'▶';
      position:absolute;right:8px;
      font-size:10px;color:#4488ff;
    }
    /* 背番号 */
    .p-num{
      width:28px;height:28px;border-radius:3px;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;font-weight:900;
      background:var(--pc,#2244aa);
      color:#fff;flex-shrink:0;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
    }
    /* ポジションバッジ */
    .p-pos{
      font-size:10px;color:#445577;
      width:36px;flex-shrink:0;
    }
    /* 名前 */
    .p-name{font-size:13px;font-weight:700;color:#ddeeff;flex:1;}
    /* 総合 */
    .p-ov{
      font-size:15px;font-weight:900;
      color:var(--oc,#aabbcc);
      flex-shrink:0;
    }

    /* ─── カードパネル（右） ─── */
    .card-panel{
      overflow-y:auto;
      padding:14px;
      background:linear-gradient(180deg,#05051a 0%,#030310 100%);
    }
    @media(max-width:640px){
      .roster-panel{height:200px;}
      .card-panel{min-height:calc(100vh - 268px);}
    }

    /* ─── プレイヤーカード ─── */
    .player-card{
      animation:cardIn .25s ease;
    }
    @keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

    .card-frame{
      border:2px solid #2244aa;border-radius:4px;
      box-shadow:0 0 0 1px #000,0 0 30px rgba(30,80,220,.2),
        inset 0 1px 0 rgba(255,255,255,.05);
      overflow:hidden;
      max-width:600px;
    }

    /* カードヘッダー */
    .c-header{
      display:flex;align-items:stretch;
      background:linear-gradient(90deg,#081440 0%,#0d1c60 40%,#0a1642 100%);
      border-bottom:2px solid #1a2a6a;
      min-height:62px;
    }
    .c-accent{width:7px;flex-shrink:0;}
    .c-hcenter{flex:1;padding:8px 12px;display:flex;align-items:center;gap:10px;}
    .c-pos{
      color:#fff;font-size:11px;font-weight:900;
      padding:3px 9px;border-radius:3px;letter-spacing:1px;flex-shrink:0;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
    }
    .c-num-badge{
      font-size:11px;font-weight:900;color:#aabbcc;
      background:#080820;border:1px solid #2244aa;
      padding:2px 7px;border-radius:3px;flex-shrink:0;
    }
    .c-name{font-size:clamp(18px,3.5vw,24px);font-weight:900;color:#fff;letter-spacing:3px;}
    .c-kana{font-size:10px;color:#6677aa;letter-spacing:3px;margin-top:2px;}
    .satei{
      margin-left:auto;flex-shrink:0;
      background:#08081e;border:1px solid #2244aa;border-radius:3px;
      padding:4px 10px;min-width:64px;text-align:center;
    }
    .satei-l{font-size:9px;color:#4466aa;letter-spacing:2px;}
    .satei-n{font-size:24px;font-weight:900;line-height:1;color:#f0c800;text-shadow:0 0 8px rgba(240,200,0,.5);}
    .satei-u{font-size:9px;color:#4466aa;}

    /* カードボディ */
    .c-body{
      display:grid;grid-template-columns:180px 1fr;
      background:linear-gradient(180deg,#06061a 0%,#040412 100%);
    }
    @media(max-width:480px){.c-body{grid-template-columns:1fr;}}

    /* ポートレート */
    .portrait{
      border-right:1px solid #141430;
      display:flex;flex-direction:column;
    }
    .portrait-box{
      aspect-ratio:1;
      display:flex;align-items:center;justify-content:center;
      position:relative;overflow:hidden;
      border-bottom:1px solid #141430;
    }
    .portrait-box::before{
      content:'';position:absolute;inset:0;
      background:repeating-linear-gradient(-45deg,transparent,transparent 10px,rgba(255,255,255,.013) 10px,rgba(255,255,255,.013) 20px);
    }
    .portrait-box::after{
      content:'';position:absolute;
      top:5px;left:5px;right:5px;bottom:5px;
      border:1px solid rgba(51,102,204,.3);border-radius:2px;pointer-events:none;
    }
    .p-img{
      position:relative;z-index:1;
      width:100%;height:100%;object-fit:cover;object-position:top center;
      display:none;
    }
    .p-img.loaded{display:block;}
    .p-emoji{position:relative;z-index:1;font-size:60px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.9));}

    /* 基本情報 */
    .p-info{padding:7px 9px;}
    .i-row{
      display:flex;justify-content:space-between;
      padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:10px;
    }
    .i-row:last-child{border-bottom:none;}
    .ik{color:#445566;}
    .iv{color:#cce;font-weight:700;}

    /* 右パネル */
    .c-right{padding:11px;display:flex;flex-direction:column;gap:9px;}

    .sec{font-size:10px;font-weight:900;letter-spacing:3px;color:#3355aa;
      background:linear-gradient(90deg,#08081a,transparent);
      padding:2px 8px;border-left:3px solid #1a3388;margin-bottom:5px;}

    /* 能力値 */
    .stat-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
    .sn{font-size:11px;color:#99aacc;width:48px;flex-shrink:0;}
    .sv{font-size:13px;font-weight:900;width:24px;text-align:right;flex-shrink:0;color:#ddeeff;}
    .gb{
      width:26px;height:19px;border-radius:2px;
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:900;color:#fff;flex-shrink:0;
      border-top:1px solid rgba(255,255,255,.3);
      border-left:1px solid rgba(255,255,255,.12);
      border-right:1px solid rgba(0,0,0,.4);
      border-bottom:1px solid rgba(0,0,0,.5);
      text-shadow:0 1px 2px rgba(0,0,0,.7);
    }
    .g-S{background:linear-gradient(180deg,#ff1a1a,#bb0000);}
    .g-A{background:linear-gradient(180deg,#ff6600,#cc3300);}
    .g-B{background:linear-gradient(180deg,#ddaa00,#996600);}
    .g-C{background:linear-gradient(180deg,#22cc22,#118811);}
    .g-D{background:linear-gradient(180deg,#1166ee,#0044cc);}
    .g-E{background:linear-gradient(180deg,#7788aa,#445566);}
    .g-F{background:linear-gradient(180deg,#445566,#223344);}
    .g-G{background:linear-gradient(180deg,#333344,#111122);}
    .sb-bg{flex:1;height:6px;background:rgba(0,0,0,.55);border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.04);}
    .sb-fill{height:100%;border-radius:3px;transition:width .8s ease;}
    .b-S{background:linear-gradient(90deg,#ff1a1a,#ff6666);}
    .b-A{background:linear-gradient(90deg,#ff6600,#ffaa44);}
    .b-B{background:linear-gradient(90deg,#cc9900,#ffdd22);}
    .b-C{background:linear-gradient(90deg,#22bb22,#55ee55);}
    .b-D{background:linear-gradient(90deg,#1166ee,#44aaff);}
    .b-E{background:linear-gradient(90deg,#667788,#99aabb);}
    .b-F{background:linear-gradient(90deg,#445566,#667788);}
    .b-G{background:linear-gradient(90deg,#223344,#445566);}

    /* 特殊能力チップ */
    .chips{display:flex;flex-wrap:wrap;gap:4px;}
    .chip{
      display:flex;align-items:center;border-radius:2px;overflow:hidden;
      border:1px solid rgba(0,0,0,.5);cursor:default;
      position:relative;transition:filter .1s;
    }
    .chip:hover{filter:brightness(1.25);}
    .ci{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
    .cn{padding:0 6px;height:20px;display:flex;align-items:center;font-size:10px;font-weight:700;white-space:nowrap;}
    .t-gold .ci{background:#7a5a00;border-right:1px solid #5a4000;}
    .t-gold .cn{background:linear-gradient(90deg,#c8900a,#a87000);color:#fff8cc;}
    .t-gold{border-color:#c09000!important;}
    .t-red .ci{background:#8a1010;border-right:1px solid #5a0808;}
    .t-red .cn{background:linear-gradient(90deg,#cc1a1a,#aa0a0a);color:#ffdddd;}
    .t-red{border-color:#cc1a1a!important;}
    .t-blue .ci{background:#0a2a88;border-right:1px solid #081a55;}
    .t-blue .cn{background:linear-gradient(90deg,#1a44bb,#0f2a99);color:#ccdeff;}
    .t-blue{border-color:#1a44bb!important;}
    .t-green .ci{background:#0a4a1a;border-right:1px solid #083310;}
    .t-green .cn{background:linear-gradient(90deg,#1a7730,#0f5520);color:#ccffdd;}
    .t-green{border-color:#1a7730!important;}
    .t-purple .ci{background:#440a66;border-right:1px solid #2a0544;}
    .t-purple .cn{background:linear-gradient(90deg,#6622aa,#441188);color:#eeccff;}
    .t-purple{border-color:#6622aa!important;}
    .t-white .ci{background:#2a3a55;border-right:1px solid #1a2a44;}
    .t-white .cn{background:linear-gradient(90deg,#3a4a66,#2a3a55);color:#cce;}
    .t-white{border-color:#3a4a66!important;}
    .chip-tip{
      display:none;position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);
      background:#08082a;border:1px solid #2244aa;color:#aabbcc;font-size:10px;font-weight:400;
      padding:5px 8px;border-radius:3px;width:170px;white-space:normal;line-height:1.5;
      z-index:200;pointer-events:none;
    }
    .chip:hover .chip-tip{display:block;}

    /* プロフィール */
    .profile{
      background:rgba(0,0,0,.35);border:1px solid #111130;border-radius:2px;
      padding:8px 10px;font-size:10px;line-height:1.85;color:#99aacc;
    }

    /* キャッチコピー */
    .catchphrase{
      background:linear-gradient(90deg,#04040e,#080820,#04040e);
      border-top:1px solid #111130;border-bottom:1px solid #111130;
      padding:9px;text-align:center;
      font-size:clamp(12px,2vw,15px);font-weight:900;
      color:#f0c800;letter-spacing:2px;
      text-shadow:0 0 10px rgba(240,200,0,.4);
    }

    /* 投打 */
    .handedness{
      display:flex;gap:12px;padding:7px 11px;
      background:#030310;border-top:1px solid #111130;
    }
    .hand-item{font-size:10px;}
    .hand-l{color:#4466aa;letter-spacing:1px;}
    .hand-v{color:#ddeeff;font-weight:700;margin-top:1px;}

    /* スクロールバー */
    ::-webkit-scrollbar{width:5px;}
    ::-webkit-scrollbar-track{background:#06061a;}
    ::-webkit-scrollbar-thumb{background:#1a3388;border-radius:3px;}

    /* 空状態 */
    .empty-card{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:100%;color:#334;font-size:14px;gap:12px;
    }
    .empty-card .ic{font-size:48px;opacity:.3;}
  </style>
</head>

      <div>選手を選択してください</div>
    </div>
  </div>
</div>

   グレード変換
────────────────────────────────────────── */
function toG(v){
  if(v>=95)return'S';if(v>=82)return'A';if(v>=68)return'B';
  if(v>=53)return'C';if(v>=38)return'D';if(v>=23)return'E';
  if(v>=10)return'F';return'G';
}
function ovColor(v){
  if(v>=90)return'#ff4444';
  if(v>=80)return'#ff8800';
  if(v>=70)return'#ddcc00';
  if(v>=60)return'#44cc44';
  return'#4488ee';
}

/* ──────────────────────────────────────────
   ロースター描画
────────────────────────────────────────── */
let currentId=null;

function renderRoster(){
  const list=document.getElementById('rosterList');
  document.getElementById('memberCount').textContent=PLAYERS.length;
  list.innerHTML='';
  PLAYERS.forEach(p=>{
    const row=document.createElement('div');
    row.className='p-row';
    row.id='row-'+p.id;
    row.style.setProperty('--pc',p.color);
    const oc=ovColor(p.overall);
    row.style.setProperty('--oc',oc);
    row.innerHTML=`
      <div class="p-num" style="background:${p.color}">${p.num}</div>
      <div class="p-pos">${p.pos}</div>
      <div class="p-name">${p.name}</div>
      <div class="p-ov" style="color:${oc}">${p.overall}</div>
    `;
    row.addEventListener('click',()=>selectPlayer(p.id));
    list.appendChild(row);
  });
}

/* ──────────────────────────────────────────
   カード描画
────────────────────────────────────────── */
function selectPlayer(id){
  currentId=id;
  document.querySelectorAll('.p-row').forEach(r=>r.classList.remove('active'));
  const row=document.getElementById('row-'+id);
  if(row)row.classList.add('active');

  const p=PLAYERS.find(x=>x.id===id);
  if(!p)return;

  const statsHtml=p.stats.map(s=>{
    const g=toG(s.v);
    return`<div class="stat-row">
      <span class="sn">${s.n}</span>
      <span class="sv">${s.v}</span>
      <div class="gb g-${g}">${g}</div>
      <div class="sb-bg"><div class="sb-fill b-${g}" style="width:0" data-w="${s.v}%"></div></div>
    </div>`;
  }).join('');

  const chipsHtml=p.abilities.map(a=>`
    <div class="chip t-${a.t}">
      <div class="ci">${a.i}</div>
      <div class="cn">${a.n}</div>
      <div class="chip-tip">${a.d}</div>
    </div>
  `).join('');

  const infoHtml=(p.info||[]).map(([k,v])=>`
    <div class="i-row"><span class="ik">${k}</span><span class="iv">${v}</span></div>
  `).join('');

  document.getElementById('cardPanel').innerHTML=`
  <div class="player-card">
    <div class="card-frame">
      <div class="c-header">
        <div class="c-accent" style="background:${p.color}"></div>
        <div class="c-hcenter">
          <div class="c-pos" style="background:${p.color}">${p.pos}</div>
          <div class="c-num-badge">#${p.num}</div>
          <div>
            <div class="c-name">${p.name}</div>
            <div class="c-kana">${p.kana}</div>
          </div>
          <div class="satei">
            <div class="satei-l">査定</div>
            <div class="satei-n">${p.overall}</div>
            <div class="satei-u">OVERALL</div>
          </div>
        </div>
      </div>
      <div class="c-body">
        <div class="portrait">
          <div class="portrait-box" style="background:linear-gradient(135deg,#0a0a20,#060618)">
            <img class="p-img" src="${p.photo}" alt="${p.name}"
              onload="this.classList.add('loaded');this.nextElementSibling.style.display='none'">
            <div class="p-emoji">🧑</div>
          </div>
          <div class="p-info">${infoHtml}</div>
        </div>
        <div class="c-right">
          <div>
            <div class="sec">◆ 基本能力</div>
            ${statsHtml}
          </div>
          <div>
            <div class="sec">◆ 特殊能力</div>
            <div class="chips">${chipsHtml}</div>
          </div>
          <div class="profile">${p.profile}</div>
        </div>
      </div>
      <div class="catchphrase">${p.catchphrase}</div>
      <div class="handedness">
        <div class="hand-item"><div class="hand-l">投</div><div class="hand-v">${p.thr}投げ</div></div>
        <div class="hand-item"><div class="hand-l">打</div><div class="hand-v">${p.bat}打ち</div></div>
      </div>
    </div>
  </div>`;

  setTimeout(()=>{
    document.querySelectorAll('.sb-fill').forEach(b=>{b.style.width=b.dataset.w;});
  },30);
}

/* 初期化 */
renderRoster();
selectPlayer(PLAYERS[0].id);
</script>
